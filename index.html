<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>for you</title>
<style>
  :root {
    color-scheme: light;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #f3efe8;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Playfair Display", "Iowan Old Style", serif;
    -webkit-tap-highlight-color: transparent;
  }

  #hero {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    user-select: none;
  }

  #floatWrap {
    animation: float 4.2s ease-in-out infinite;
  }

  #heartBtn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: block;
    line-height: 0;
  }

  #heartBtn svg {
    width: 140px;
    height: 140px;
    display: block;
  }

  #heartBtn.pulse svg {
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #heartBtn:disabled {
    cursor: default;
  }

  #clickText {
    text-align: center;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  #clickText.hidden {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }

  .click-me {
    font-size: 2rem;
    font-weight: 700;
    color: #b3273f;
  }

  .sub {
    margin-top: 0.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #cba7ae;
  }

  #burstStage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  .burst-heart {
    position: fixed;
    transform: translate(-50%, -50%) scale(0.18) rotate(0deg);
    opacity: 0;
    transition-property: transform, opacity;
    transition-timing-function: cubic-bezier(0.3, 1.4, 0.55, 1), ease-out;
    will-change: transform, opacity;
  }

  .burst-heart svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 2px 5px rgba(120, 30, 45, 0.15));
  }

  .burst-heart.settled {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot));
    opacity: 1;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); }
    55% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

  <div id="hero">
    <div id="floatWrap">
      <button id="heartBtn" aria-label="Open">
        <div id="heartIcon"></div>
      </button>
    </div>
    <div id="clickText">
      <div class="click-me">Click me</div>
      <div class="sub">Go on, it opens</div>
    </div>
  </div>

  <div id="burstStage"></div>

  <script>
    const HEART_PATH =
      "M50 91.5C44.2 86.2 18 64.1 10.7 50.1 2.8 34.9 10.3 17.5 26.7 13.1 36.7 10.4 45.2 15.1 50 23.8 54.8 15.1 63.3 10.4 73.3 13.1 89.7 17.5 97.2 34.9 89.3 50.1 82 64.1 55.8 86.2 50 91.5Z";

    const CENTRAL_HEART_SIZE = 140;
    let heartUid = 0;
    function heartMarkup(color) {
      const id = "h" + heartUid++;
      return (
        '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="color:' + color + '">' +
        '<defs>' +
        '<clipPath id="clip-' + id + '"><path d="' + HEART_PATH + '" /></clipPath>' +
        '<pattern id="stripe-' + id + '" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">' +
        '<line x1="0" y1="0" x2="0" y2="11" stroke="color-mix(in srgb, currentColor 65%, white)" stroke-width="4" />' +
        '</pattern>' +
        '</defs>' +
        '<path d="' + HEART_PATH + '" fill="currentColor" />' +
        '<rect width="100" height="100" fill="url(#stripe-' + id + ')" opacity="0.32" clip-path="url(#clip-' + id + ')" />' +
        '</svg>'
      );
    }

    function randomColor() {
      // Narrow crimson/maroon/rose band only -- no wraparound past 360, so it
      // never drifts into orange the way a wider or wrapped hue range would.
      const hue = 344 + Math.random() * 15;
      const sat = 50 + Math.random() * 35;
      const light = 30 + Math.random() * 44;
      return "hsl(" + hue.toFixed(1) + " " + sat.toFixed(0) + "% " + light.toFixed(0) + "%)";
    }

    const heartBtn = document.getElementById("heartBtn");
    const heartIcon = document.getElementById("heartIcon");
    const clickText = document.getElementById("clickText");
    const burstStage = document.getElementById("burstStage");

    heartIcon.innerHTML = heartMarkup("#c52443");

    // The reference layout isn't circular bursts of random points -- it reads as a
    // staggered grid (offset rows, like laid brick), each cell nudged with a little
    // jitter so it doesn't look mechanical. That's what actually keeps hearts evenly
    // spaced with no overlap: a rejection-sampled scatter has to fight for even
    // coverage, a grid gets it for free. Size is layered on top as a smooth gradient
    // by each cell's distance from the center (near = closer to full size, far =
    // smaller), so the "thrown outward, shrinking" feel survives the switch to a grid.
    function buildTargets(cx, cy, vw, vh) {
      const cellW = 200;
      const cellH = 148;
      // small nudge, not a scatter -- enough to feel hand-placed without breaking
      // the row/column read that makes the layout look patterned instead of jittery
      const jitterX = cellW * 0.12;
      const jitterY = cellH * 0.12;
      const maxDist = Math.hypot(vw, vh) / 2;
      const centralExclusion = CENTRAL_HEART_SIZE / 2 + 50;

      // the grid is built in its own (u, v) space, tilted ~15deg before landing in
      // page coordinates -- an axis-aligned grid reads as flat horizontal rows, a
      // tilted one reads as the diagonal "flow" the reference photo has
      const theta = (15 * Math.PI) / 180;
      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);

      const placed = [];
      function overlaps(x, y, size) {
        for (let i = 0; i < placed.length; i++) {
          const p = placed[i];
          const d = Math.hypot(p.x - x, p.y - y);
          if (d < ((p.size + size) / 2) * 0.9) return true;
        }
        return false;
      }

      // grid extent generous enough that, once rotated, it still covers every
      // corner of the page
      const extent = Math.hypot(vw, vh) / 2 + cellW;
      const rowSpan = Math.ceil(extent / cellH);
      const colSpan = Math.ceil(extent / cellW);
      const edgeMargin = 60; // how far a cell may land past the page edge

      const targets = [];
      for (let r = -rowSpan; r <= rowSpan; r++) {
        const rowOffset = (((r % 2) + 2) % 2 === 0) ? 0 : cellW / 2;
        for (let c = -colSpan; c <= colSpan; c++) {
          const u0 = c * cellW + cellW / 2 + rowOffset;
          const v0 = r * cellH + cellH / 2;

          let best = null;
          for (let attempt = 0; attempt < 10; attempt++) {
            const u = u0 + (Math.random() - 0.5) * 2 * jitterX;
            const v = v0 + (Math.random() - 0.5) * 2 * jitterY;
            const dist = Math.hypot(u, v);
            if (dist < centralExclusion) continue; // leave the anchor heart's cell empty
            if (dist > maxDist * 1.2) continue; // well past the page, not worth placing

            const x = cx + (u * cosT - v * sinT);
            const y = cy + (u * sinT + v * cosT);
            if (x < -edgeMargin || x > vw + edgeMargin || y < -edgeMargin || y > vh + edgeMargin) continue;

            const t = Math.min(dist / maxDist, 1);
            const sizeFactor = (1 - 0.62 * t) * (0.88 + Math.random() * 0.24);
            const size = CENTRAL_HEART_SIZE * Math.max(sizeFactor, 0.3);
            best = { x, y, size, dist };
            if (!overlaps(x, y, size)) break;
          }
          if (best) {
            placed.push(best);
            targets.push(best);
          }
        }
      }

      // throw order grows outward from the center overall, but with a little
      // look-ahead shuffle so it doesn't fire in a rigid row-by-row sweep
      targets.sort((a, b) => a.dist - b.dist);
      for (let i = 0; i < targets.length; i++) {
        const swapWith = Math.min(targets.length - 1, i + Math.floor(Math.random() * 6));
        const tmp = targets[i];
        targets[i] = targets[swapWith];
        targets[swapWith] = tmp;
      }

      return targets;
    }

    function burst() {
      const rect = heartBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const targets = buildTargets(cx, cy, window.innerWidth, window.innerHeight);

      function spawnOne(t) {
        const dx = t.x - cx;
        const dy = t.y - cy;
        const rot = (Math.random() * 36 - 18).toFixed(1);
        const color = randomColor();
        const duration = 160 + Math.random() * 140;

        const el = document.createElement("div");
        el.className = "burst-heart";
        el.style.left = cx + "px";
        el.style.top = cy + "px";
        el.style.width = t.size + "px";
        el.style.height = t.size + "px";
        el.style.setProperty("--dx", dx + "px");
        el.style.setProperty("--dy", dy + "px");
        el.style.setProperty("--rot", rot + "deg");
        el.style.transitionDuration = duration + "ms";
        el.innerHTML = heartMarkup(color);
        burstStage.appendChild(el);

        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("settled")));
      }

      // two hearts thrown per frame -- one right after another, faster than one-per-frame
      let i = 0;
      function throwNext() {
        spawnOne(targets[i++]);
        if (i < targets.length) spawnOne(targets[i++]);
        if (i < targets.length) requestAnimationFrame(throwNext);
      }
      throwNext();
    }

    heartBtn.addEventListener(
      "click",
      () => {
        heartBtn.disabled = true;
        clickText.classList.add("hidden");
        heartBtn.classList.add("pulse");
        burst();
      },
      { once: true }
    );
  </script>

</body>
</html>
